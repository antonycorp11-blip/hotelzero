<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vale Pixelado — MVP Medieval 3D</title>
<style>
  :root{
    --bg:rgba(18,16,14,.82); --bg2:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
    --txt:#f3ead8; --mut:#b9ad97; --gold:#f2c14e; --red:#e04848; --green:#6fcf5a;
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd4f0;color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;
    -webkit-touch-callout:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
  #game.pixel{image-rendering:pixelated;image-rendering:crisp-edges}
  button{font:inherit;cursor:pointer;color:var(--txt);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
  button:hover:not(:disabled){background:rgba(255,255,255,.14)}
  button:active:not(:disabled){transform:translateY(1px)}
  button.primary{background:var(--gold);color:#2a1d08;border-color:#ffd97a;font-weight:700}
  button.primary:hover:not(:disabled){background:#ffd36a}
  button:disabled{opacity:.45;cursor:default}

  /* ---------- HUD (compacto) ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #status{position:absolute;left:calc(10px + var(--safe-l));top:calc(10px + var(--safe-t));display:flex;flex-direction:column;gap:6px}
  #hpBar{position:relative;width:170px;height:12px;border-radius:7px;background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.25);overflow:hidden}
  #hpFill{position:absolute;inset:0;width:100%;background:linear-gradient(#ff6b6b,#c93030);transition:width .2s}
  #hpBar.low #hpFill{animation:pulse .8s infinite alternate}
  @keyframes pulse{to{filter:brightness(1.6)}}
  #hpText{position:absolute;inset:0;font-size:9px;line-height:11px;text-align:center;font-weight:700;text-shadow:0 1px 2px #000}
  #res{display:flex;gap:4px;flex-wrap:wrap;max-width:260px}
  .chip{display:flex;align-items:center;gap:3px;padding:1px 6px 1px 4px;border-radius:9px;background:rgba(0,0,0,.45);
    font-size:12px;font-weight:600;text-shadow:0 1px 1px #000}
  .chip.zero{opacity:.45}
  .chip.bump{animation:bump .35s}
  @keyframes bump{50%{transform:scale(1.3);background:rgba(242,193,78,.6)}}
  #topRight{position:absolute;right:calc(10px + var(--safe-r));top:calc(10px + var(--safe-t));display:flex;gap:6px;pointer-events:auto}
  .iconbtn{width:38px;height:38px;padding:0;border-radius:50%;background:rgba(0,0,0,.45);font-size:17px;display:flex;align-items:center;justify-content:center}
  #hint{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);padding:4px 10px;border-radius:6px;
    background:rgba(0,0,0,.5);font-size:13px;display:none;white-space:nowrap}
  #toast{position:absolute;left:50%;top:calc(14px + var(--safe-t));transform:translateX(-50%);padding:6px 14px;border-radius:8px;
    background:var(--bg);border:1px solid var(--line);font-size:13px;display:none;text-align:center;max-width:calc(100vw - 120px)}
  #controls{position:absolute;left:calc(10px + var(--safe-l));bottom:calc(10px + var(--safe-b));padding:8px 12px;border-radius:8px;
    background:rgba(0,0,0,.45);font-size:12px;line-height:1.6;max-width:min(380px,calc(100vw - 20px));transition:opacity .6s}
  #controls.hide{opacity:0}
  #controls b{color:var(--gold)}

  /* ---------- efeitos ---------- */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .ft{position:absolute;left:0;top:0;white-space:nowrap;font-weight:900;
    text-shadow:0 0 3px #000,1px 1px 0 #000,-1px -1px 0 #000;will-change:transform,opacity}
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;
    background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(200,0,0,.55) 100%)}
  #death{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;
    background:rgba(40,0,0,.45);font-size:26px;font-weight:800;text-shadow:0 2px 6px #000;text-align:center}

  /* ---------- inventário ---------- */
  #invWrap{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.45);padding:calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l))}
  #invWrap.open{display:flex}
  #inv{width:100%;max-width:780px;max-height:100%;display:flex;flex-direction:column;background:var(--bg);
    border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #inv header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
  #inv header h2{margin:0;font-size:17px}
  #inv header small{color:var(--mut);font-weight:400;margin-left:8px;font-size:12px}
  #invClose{width:34px;height:34px;padding:0;border-radius:50%;font-size:16px}
  .inv-grid{display:grid;grid-template-columns:250px 1fr;gap:16px;padding:14px 16px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .inv-grid h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
  .slot{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;min-height:76px}
  .slot .ico{font-size:24px;line-height:30px}
  .slot .lb{font-size:10px;color:var(--mut);text-transform:uppercase}
  .slot .nm{font-size:11px;font-weight:600;margin-top:2px}
  .slot.empty .ico{opacity:.25}
  #invStats{font-size:12px;color:var(--mut);margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap}
  #invStats b{color:var(--txt)}
  .res-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .res-grid div{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:8px;padding:6px 8px;font-size:13px}
  .res-grid b{margin-left:auto}
  .recipes{display:flex;flex-direction:column;gap:8px}
  .card{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px}
  .card.equipped{border-color:rgba(242,193,78,.7);background:rgba(242,193,78,.1)}
  .card .ico{font-size:28px;width:40px;text-align:center;flex-shrink:0}
  .card .info{flex:1;min-width:0}
  .card .info b{font-size:14px}
  .card .info small{display:block;color:var(--mut);font-size:12px;margin:1px 0 4px}
  .cost{display:flex;gap:4px;flex-wrap:wrap}
  .cost span{font-size:11px;padding:1px 6px;border-radius:8px;background:rgba(0,0,0,.3)}
  .cost .ok{color:var(--green)} .cost .no{color:#ff8a8a}
  .card .btns{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
  .card .btns button{min-width:92px;font-size:13px;padding:7px 10px}
  @media (max-width:640px){
    .inv-grid{grid-template-columns:1fr;padding:12px}
    #invWrap{padding:0}
    #inv{max-width:none;height:100%;border-radius:0;border:0}
    #inv header{padding-top:calc(12px + var(--safe-t))}
  }

  /* ---------- toque ---------- */
  #touchUI{position:fixed;inset:0;pointer-events:none;z-index:6;display:none}
  body.touch #touchUI{display:block}
  #joyBase{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;
    border:2px solid rgba(255,255,255,.6);background:rgba(0,0,0,.18);display:none}
  #joyKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
    background:rgba(255,255,255,.7)}
  .tbtn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;
    touch-action:none;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.5)}
  #joyBase.idle{display:block;opacity:.35;left:calc(95px + var(--safe-l));top:calc(100% - 95px - var(--safe-b))}
  #btnAtk{right:calc(26px + var(--safe-r));bottom:calc(26px + var(--safe-b));width:88px;height:88px;font-size:36px}
  #btnAtk.held{background:rgba(242,193,78,.45)}
  #btnDodge{right:calc(128px + var(--safe-r));bottom:calc(20px + var(--safe-b));width:60px;height:60px;font-size:24px}
  #btnPot{right:calc(40px + var(--safe-r));bottom:calc(128px + var(--safe-b));width:54px;height:54px;font-size:22px}
  #btnDodge.cd{opacity:.4}
  body.touch #controls{left:50%;transform:translateX(-50%);bottom:calc(10px + var(--safe-b));text-align:center;max-width:min(460px,calc(100vw - 340px))}
  body.touch #btnPixel{display:none}
  body.touch #hint{bottom:calc(30px + var(--safe-b))}
  /* aviso de orientação */
  #rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#16130f;color:var(--txt);font-size:17px;text-align:center;padding:24px}
  #rotate .ph{font-size:56px;animation:rot 1.6s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){ body.touch #rotate{display:flex} }
  /* inventário em tela de pouca altura (celular deitado) */
  @media (max-height:520px){
    #invWrap{padding:0}
    #inv{max-width:none;height:100%;border-radius:0;border:0}
    #inv header{padding:8px calc(14px + var(--safe-r)) 8px calc(14px + var(--safe-l))}
    .inv-grid{grid-template-columns:minmax(220px,34%) 1fr;padding:10px calc(14px + var(--safe-r)) 14px calc(14px + var(--safe-l));gap:14px}
    .slot{min-height:64px;padding:6px 4px}
    .card{padding:7px 10px;gap:10px}
    .card .ico{font-size:24px;width:32px}
    .card .btns{flex-direction:row}
    .card .btns button{min-width:80px;padding:9px 10px}
    #invStats{margin-bottom:10px}
  }
  @media (max-width:600px){ #hpBar{width:130px} #res{max-width:200px} .chip{font-size:11px} }

  /* ---------- tela inicial / erro ---------- */
  #start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,14,10,.45)}
  #start .box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:24px 28px;text-align:center;max-width:min(420px,calc(100vw - 32px))}
  #start h1{margin:0 0 6px;font-size:26px;letter-spacing:1px}
  #start p{margin:6px 0 18px;font-size:14px;color:var(--mut);line-height:1.5}
  #start button{font-size:17px;padding:10px 34px}
  #err{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#300;color:#fbb;padding:8px;
    font-size:12px;white-space:pre-wrap;display:none;max-height:40vh;overflow:auto;font-family:monospace}
</style>
</head>
<body>

<div id="hud">
  <div id="status">
    <div id="hpBar"><div id="hpFill"></div><div id="hpText">20/20</div></div>
    <div id="res"></div>
  </div>
  <div id="topRight">
    <button class="iconbtn" id="btnPixel" title="Modo pixel (P)">▦</button>
    <button class="iconbtn" id="btnHelp" title="Ajuda (H)">?</button>
    <button class="iconbtn" id="btnInv" title="Inventário (I)">🎒</button>
  </div>
  <div id="hint"></div>
  <div id="toast"></div>
  <div id="controls"></div>
</div>
<div id="fx"></div>
<div id="vignette"></div>
<div id="death"><div>VOCÊ CAIU!<br><span style="font-size:14px;font-weight:500">Renascendo no acampamento...</span></div></div>

<div id="invWrap">
  <div id="inv">
    <header><h2>Inventário<small>jogo pausado</small></h2><button id="invClose" title="Fechar (I / Esc)">✕</button></header>
    <div class="inv-grid">
      <section>
        <h3>Equipado</h3>
        <div class="slots" id="invSlots"></div>
        <div id="invStats"></div>
        <h3>Recursos</h3>
        <div class="res-grid" id="invRes"></div>
      </section>
      <section>
        <h3>Forja e itens</h3>
        <div class="recipes" id="invRecipes"></div>
      </section>
    </div>
  </div>
</div>

<div id="touchUI">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button id="btnPot" class="tbtn" title="Poção">🧪</button>
  <button id="btnDodge" class="tbtn" title="Esquiva">💨</button>
  <button id="btnAtk" class="tbtn" title="Atacar / coletar">⚔</button>
</div>

<div id="start">
  <div class="box">
    <h1>⚔ VALE PIXELADO</h1>
    <p>Colete madeira e pedra, derrote lobos, esqueletos e slimes,
       e forje seu equipamento.</p>
    <button id="btnStart" class="primary">JOGAR</button>
  </div>
</div>
<div id="rotate"><div class="ph">📱</div>Gire o celular para jogar na horizontal</div>
<div id="err"></div>

<!-- Aviso caso o Three.js não carregue do CDN -->
<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent += '[Erro] ' + (e.message || e) + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : '') + '\n';
  });
  setTimeout(function () {
    if (!window.__gameStarted) {
      var el = document.getElementById('err');
      el.style.display = 'block';
      el.textContent += 'Não foi possível iniciar o jogo. Verifique a conexão com a internet (o Three.js é carregado de unpkg.com).\n';
    }
  }, 12000);
</script>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

/* =====================================================================
   UTILITÁRIOS
   ===================================================================== */
const TAU = Math.PI * 2;
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (IS_TOUCH) document.body.classList.add('touch');

let seed = 20261031;                         // RNG determinístico para gerar o mundo
function rnd() {
  seed |= 0; seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rr = (a, b) => a + rnd() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
const dampAngle = (a, b, l, dt) => a + angDiff(a, b) * (1 - Math.exp(-l * dt));
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const $ = id => document.getElementById(id);

/* =====================================================================
   RENDERER, CENA, LUZ
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.id = 'game';
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const SKY = 0x9fd4f0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 34, 82);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 220);

// Modo pixel opcional (tecla P): renderiza em baixa resolução + texturas "nearest"
let pixelMode = false;
// Qualidade automática: no celular começa em 1.25x e reduz se o FPS cair
const DPR_STEPS = IS_TOUCH ? [1.5, 1.25, 1, 0.85, 0.7] : [2, 1.5, 1.25, 1];
let dprIdx = IS_TOUCH ? 1 : 0;
function resize() {
  const w = innerWidth, h = innerHeight;
  if (pixelMode) { renderer.setPixelRatio(1); renderer.setSize(Math.ceil(w / 3), Math.ceil(h / 3), false); }
  else { renderer.setPixelRatio(Math.min(devicePixelRatio || 1, DPR_STEPS[dprIdx])); renderer.setSize(w, h, false); }
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const hemi = new THREE.HemisphereLight(0xdcefff, 0x5a7a3a, 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d0, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(IS_TOUCH ? 1024 : 2048, IS_TOUCH ? 1024 : 2048);
const sc = sun.shadow.camera;
sc.left = -26; sc.right = 26; sc.top = 26; sc.bottom = -26; sc.near = 1; sc.far = 120;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const SUN_OFFSET = new THREE.Vector3(28, 45, 18);

/* =====================================================================
   TEXTURAS (geradas em canvas, sem imagens externas)
   ===================================================================== */
const ALL_TEX = [];
function applyFilter(t) {
  t.magFilter = pixelMode ? THREE.NearestFilter : THREE.LinearFilter;
  t.minFilter = pixelMode ? THREE.NearestMipmapNearestFilter : THREE.LinearMipmapLinearFilter;
  t.needsUpdate = true;
}
function makeTex(size, painter, rep = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  painter(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rep, rep);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  applyFilter(t);
  ALL_TEX.push(t);
  return t;
}
function px(g, x, y, c) { g.fillStyle = c; g.fillRect(x, y, 1, 1); }
function noise(g, s, pal) { for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) px(g, x, y, pal[(rnd() * pal.length) | 0]); }
function blotches(g, s, color, n, rmin, rmax) {
  g.fillStyle = color;
  for (let i = 0; i < n; i++) { g.beginPath(); g.arc(rnd() * s, rnd() * s, rr(rmin, rmax), 0, TAU); g.fill(); }
}

const TEX = {
  grass: makeTex(128, (g, s) => {
    noise(g, s, ['#5c9e3b', '#5c9e3b', '#57963a', '#64a740', '#518d35', '#6aad44']);
    blotches(g, s, 'rgba(40,90,25,.18)', 50, 4, 12);
    blotches(g, s, 'rgba(140,200,90,.12)', 40, 3, 9);
    for (let i = 0; i < 380; i++) { const x = rnd() * s | 0, y = rnd() * s | 0; g.fillStyle = rnd() < .5 ? '#3f7a2b' : '#7fc055'; g.fillRect(x, y, 1, 3); }
    for (let i = 0; i < 8; i++) px(g, rnd() * s | 0, rnd() * s | 0, ['#f4e35a', '#ffffff', '#e86a6a'][i % 3]);
  }, 40),
  bark: makeTex(32, (g, s) => {
    noise(g, s, ['#6b4426', '#5c3920', '#734a2a', '#62401f']);
    for (let x = 0; x < s; x += 4) for (let y = 0; y < s; y++) if (rnd() < .7) px(g, x + (rnd() < .3 ? 1 : 0), y, '#472c17');
  }),
  leaf: makeTex(32, (g, s) => {
    noise(g, s, ['#3f8a32', '#367a2c', '#4a9a3a', '#2f6c27']);
    blotches(g, s, 'rgba(120,200,90,.35)', 14, 1, 3);
    blotches(g, s, 'rgba(20,60,20,.35)', 10, 1, 3);
  }),
  pine: makeTex(32, (g, s) => {
    noise(g, s, ['#2d6a3a', '#275e33', '#337540', '#21522c']);
    for (let y = 1; y < s; y += 3) for (let x = 0; x < s; x++) if (rnd() < .5) px(g, x, y, '#1a4223');
  }),
  stone: makeTex(32, (g, s) => {
    noise(g, s, ['#8a8f96', '#7d828a', '#959aa1', '#83888f']);
    blotches(g, s, 'rgba(60,64,70,.25)', 10, 1, 4);
    blotches(g, s, 'rgba(210,214,220,.2)', 10, 1, 3);
    let x = 6, y = 3; for (let i = 0; i < 18; i++) { px(g, x, y, '#55595f'); x += rnd() < .5 ? 1 : 0; y++; }
  }),
  fabric: makeTex(32, (g, s) => {
    noise(g, s, ['#3d5a99', '#38548f', '#4262a3']);
    for (let y = 0; y < s; y += 2) for (let x = 0; x < s; x++) if ((x + y) % 4 === 0) px(g, x, y, 'rgba(255,255,255,.08)');
  }),
  pants: makeTex(32, (g, s) => noise(g, s, ['#5b4a3a', '#544434', '#625040'])),
  boots: makeTex(32, (g, s) => { noise(g, s, ['#3a2618', '#33211a', '#422c1c']); blotches(g, s, 'rgba(255,220,180,.06)', 8, 2, 5); }),
  cape: makeTex(32, (g, s) => {

/* ---------- geometrias compartilhadas (cache) ---------- */
const geoCache = new Map();
function cached(key, make) { if (!geoCache.has(key)) geoCache.set(key, make()); return geoCache.get(key); }
const boxGeo = (w, h, d) => cached(`b${w}_${h}_${d}`, () => new THREE.BoxGeometry(w, h, d));
const capGeo = (r, len) => cached(`c${r}_${len}`, () => new THREE.CapsuleGeometry(r, len, 4, 10));
const latheGeo = (key, pts, seg = 16) => cached('l' + key, () => new THREE.LatheGeometry(pts.map(([r, y]) => new THREE.Vector2(r, y)), seg));
function mesh(geo, mat, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = shadow;
  return m;
}
const box = (w, h, d, mat, x, y, z) => mesh(boxGeo(w, h, d), mat, x, y, z);
const cap = (r, len, mat, x, y, z) => mesh(capGeo(r, len), mat, x, y, z);
function group(x = 0, y = 0, z = 0, parent) {
  const g = new THREE.Group(); g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
}
const SPH = new THREE.SphereGeometry(1, 20, 14);
const DOME = new THREE.SphereGeometry(1, 20, 10, 0, TAU, 0, Math.PI / 2);
function ball(rx, ry, rz, mat, x, y, z, geo = SPH) { const m = mesh(geo, mat, x, y, z); m.scale.set(rx, ry, rz); return m; }

const G = {
  trunk: new THREE.CylinderGeometry(0.22, 0.32, 1.8, 7),
  oakTop: new THREE.IcosahedronGeometry(1.25, 0),

  pineA: new THREE.ConeGeometry(1.35, 1.8, 7),

  rockSmall: new THREE.DodecahedronGeometry(0.38, 0),
  pebble: new THREE.DodecahedronGeometry(0.2, 0),

/* =====================================================================
   MUNDO: terreno, árvores, pedras, arbustos, grama, acampamento, nuvens
   ===================================================================== */
const WORLD = 170;          // tamanho do terreno
const PLAY = 46;            // área jogável (raio quadrado)
function heightAt(x, z) {
  let h = Math.sin(x * 0.07) * 1.3 + Math.cos(z * 0.06) * 1.1
        + Math.sin((x + z) * 0.13) * 0.5 + Math.sin(x * 0.21 - z * 0.17) * 0.25;
  const e = Math.max(Math.abs(x), Math.abs(z)) - 48;   // colinas nas bordas
  if (e > 0) h += e * e * 0.035;
  return h;
}

{ // terreno
  const tg = new THREE.PlaneGeometry(WORLD, WORLD, 110, 110);
  tg.rotateX(-Math.PI / 2);
  const p = tg.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)));
  tg.computeVertexNormals();
  const terrain = new THREE.Mesh(tg, M.grass);
  terrain.receiveShadow = true;
  scene.add(terrain);
}

// Obstáculos (colisão circular) e recursos coletáveis
const obstacles = [];   // {x,z,r,active}
const resources = [];   // árvores e pedras
const placed = [];
function findSpot(minDist, avoidCenter = 7, range = PLAY - 2) {
  for (let i = 0; i < 40; i++) {
    const x = rr(-range, range), z = rr(-range, range);
    if (Math.hypot(x, z) < avoidCenter) continue;
    if (placed.every(p => Math.hypot(p.x - x, p.z - z) > minDist + p.r)) return { x, z };
  }
  return null;
}

function buildTree(pine) {
  const g = new THREE.Group();
  g.add(mesh(G.trunk, M.bark, 0, 0.9, 0));
  if (pine) {
    g.add(mesh(G.pineA, M.pine, 0, 2.1, 0), mesh(G.pineB, M.pine, 0, 2.95, 0), mesh(G.pineC, M.pine, 0, 3.65, 0));
  } else {
    const t3 = mesh(G.oakTop2, M.leaf, -0.5, 2.7, -0.35);
    t3.scale.setScalar(0.8);
    g.add(mesh(G.oakTop, M.leaf, 0, 2.45, 0), mesh(G.oakTop2, M.leaf, 0.55, 2.95, 0.25), t3);
  }
  return g;
}
function buildRock() {
  const g = new THREE.Group();
  const a = mesh(G.rock, M.stone, 0, 0.35, 0);
  a.scale.set(1, 0.75, 1);
  a.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
  const b = mesh(G.rockSmall, M.stone, 0.55, 0.15, 0.3);
  b.rotation.set(rnd() * 3, rnd() * 3, 0);
  g.add(a, b);
  return g;
}
function addResource(kind, x, z) {
  const obj = kind === 'tree' ? buildTree(rnd() < 0.45) : buildRock();
  const s = kind === 'tree' ? rr(0.85, 1.25) : rr(0.8, 1.25);
  obj.scale.setScalar(s);
  obj.rotation.y = rnd() * TAU;
  obj.position.set(x, heightAt(x, z) - 0.05, z);
  scene.add(obj);
  const r = kind === 'tree' ? 0.45 * s : 0.85 * s;
  const ob = { x, z, r, active: true };
  obstacles.push(ob);
  placed.push({ x, z, r: r + 0.6 });
  const maxHp = kind === 'tree' ? 4 : 5;
  resources.push({ kind, obj, x, z, r, ob, hp: maxHp, maxHp, baseScale: s, shake: 0, state: 'alive', t: 0, respawnAt: 0 });
}
const TREE_COUNT = 55, ROCK_COUNT = 26;
for (let i = 0; i < TREE_COUNT; i++) { const p = findSpot(2.2); if (p) addResource('tree', p.x, p.z); }
for (let i = 0; i < ROCK_COUNT; i++) { const p = findSpot(2.0); if (p) addResource('rock', p.x, p.z); }
// Árvores decorativas nas colinas da borda (fora da área jogável)
for (let i = 0; i < 70; i++) {
  const a = rnd() * TAU, d = rr(52, 70);
  const x = Math.cos(a) * d, z = Math.sin(a) * d;
  const t = buildTree(rnd() < .6);
  t.scale.setScalar(rr(1, 1.5));
  t.position.set(x, heightAt(x, z) - .1, z);
  t.traverse(o => { if (o.isMesh) o.castShadow = false; });
  scene.add(t);
}

{ // arbustos, tufos de grama e flores via InstancedMesh (1 draw call cada)
  const dummy = new THREE.Object3D();
  const BUSH = 90;
  const bushes = new THREE.InstancedMesh(G.bush, M.bush, BUSH);
  bushes.castShadow = true; bushes.receiveShadow = true;
  for (let i = 0; i < BUSH; i += 2) {
    const p = findSpot(1.2, 4) || { x: rr(-40, 40), z: rr(-40, 40) };
    placed.push({ x: p.x, z: p.z, r: 0.6 });
    for (let k = 0; k < 2; k++) {
      const x = p.x + (k ? rr(-.5, .5) : 0), z = p.z + (k ? rr(-.5, .5) : 0);
      const s = k ? rr(.6, .85) : rr(.85, 1.2);
      dummy.position.set(x, heightAt(x, z) + 0.25 * s, z);
      dummy.rotation.set(rnd(), rnd() * 3, rnd());
      dummy.scale.set(s, s * .8, s);
      dummy.updateMatrix();
      bushes.setMatrixAt(i + k, dummy.matrix);
    }
  }
  scene.add(bushes);

  const BLADES = 900;
  const blades = new THREE.InstancedMesh(G.blade, new THREE.MeshLambertMaterial({ color: 0x6aa844 }), BLADES);
  blades.receiveShadow = true;
  for (let i = 0; i < BLADES; i++) {
    const cx = rr(-PLAY, PLAY), cz = rr(-PLAY, PLAY);
    dummy.position.set(cx, heightAt(cx, cz) + 0.17, cz);
    dummy.rotation.set(rr(-.35, .35), rnd() * 3, rr(-.35, .35));
    dummy.scale.setScalar(rr(.7, 1.3));
    dummy.updateMatrix();
    blades.setMatrixAt(i, dummy.matrix);
  }
  scene.add(blades);

  const FLOWERS = 160;
  const flowers = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.07, 0), new THREE.MeshLambertMaterial({ color: 0xffffff }), FLOWERS);
  const fc = [0xf4e35a, 0xffffff, 0xe86a6a, 0xb98aea, 0xff9ad5].map(c => new THREE.Color(c));
  for (let i = 0; i < FLOWERS; i++) {
    const x = rr(-PLAY, PLAY), z = rr(-PLAY, PLAY);
    dummy.position.set(x, heightAt(x, z) + 0.14, z);
    dummy.rotation.set(0, rnd() * 3, 0); dummy.scale.setScalar(1);
    dummy.updateMatrix();
    flowers.setMatrixAt(i, dummy.matrix);
    flowers.setColorAt(i, fc[i % fc.length]);

  flowers.instanceColor.needsUpdate = true;
  scene.add(flowers);

/* =====================================================================
   PERSONAGEM: guerreiro montado em hierarquia de grupos ("ossos")
   root → hips → (torso → chest / neck → head / shoulders → elbows → hands → grip / cape)
               + (hip joints → knees)
   Proporções humanas (~1,8 m). Membros são perfis torneados (LatheGeometry),
   com afinamento como músculos. O modelo olha para +Z; o braço direito fica em -X.
   ===================================================================== */
// Perfil de membro: começa em y=0 e desce até -len, com "barriga" muscular
function limbGeo(key, len, rTop, rMid, rBot) {
  return latheGeo(key, [
    [0.001, rTop * 0.6], [rTop * 0.7, rTop * 0.45], [rTop, 0], [rMid, -len * 0.3],
    [(rMid + rBot) / 2, -len * 0.65], [rBot, -len * 0.92], [rBot * 0.75, -len - rBot * 0.35], [0.001, -len - rBot * 0.6]], 14);
}
const TORSO_PROFILE = [[0, 0], [0.145, 0], [0.15, 0.08], [0.163, 0.2], [0.188, 0.33], [0.2, 0.41], [0.188, 0.47], [0.13, 0.52], [0.06, 0.545], [0, 0.55]];
const SKIRT_PROFILE = [[0.158, 0.07], [0.165, -0.02], [0.185, -0.13], [0.205, -0.25]];
const ARMOR_PROFILE = [[0.165, 0.05], [0.172, 0.12], [0.185, 0.22], [0.208, 0.33], [0.218, 0.41], [0.205, 0.47], [0.15, 0.52], [0.11, 0.535]];
const CAPE_GEO = new THREE.CylinderGeometry(0.15, 0.27, 0.86, 12, 1, true, Math.PI - 1.05, 2.1);

function buildWarrior() {
  // Materiais clonados: permitem piscar em vermelho só neste personagem
  const m = {};
  for (const k of ['skin', 'tunic', 'pants', 'boots', 'hair', 'cape', 'leather', 'gold', 'lips']) m[k] = M[k].clone();
  m.skirt = m.tunic.clone(); m.skirt.side = THREE.DoubleSide;
  const J = {};
  J.root = new THREE.Group();
  J.hips = group(0, 0.95, 0, J.root);
  J.hips.add(ball(0.15, 0.1, 0.11, m.pants, 0, 0, 0));                              // pélvis
  const skirt = mesh(latheGeo('skirt', SKIRT_PROFILE), m.skirt, 0, 0, 0);
  skirt.scale.z = 0.75; J.hips.add(skirt);                                            // saiote da túnica

  J.torso = group(0, 0.04, 0, J.hips);
  J.chest = group(0, 0, 0, J.torso);                                                  // respira e recebe o peitoral
  const trunk = mesh(latheGeo('torso', TORSO_PROFILE), m.tunic, 0, 0, 0);
  trunk.scale.z = 0.64; J.chest.add(trunk);
  const belt = mesh(latheGeo('belt', [[0.153, 0], [0.156, 0.07]]), m.leather, 0, 0.01, 0);
  belt.scale.z = 0.66; J.chest.add(belt);
  J.chest.add(box(0.05, 0.05, 0.02, m.gold, 0, 0.045, 0.1));                         // fivela
  J.chest.add(ball(0.045, 0.055, 0.03, m.leather, 0.12, -0.02, 0.07));               // bolsinha
  J.chest.add(ball(0.13, 0.03, 0.09, m.tunic, 0, 0.5, 0));                            // gola

  J.neck = group(0, 0.52, 0, J.torso);
  J.neck.add(mesh(limbGeo('neck', 0.09, 0.05, 0.048, 0.052), m.skin, 0, 0.1, 0));
  J.head = group(0, 0.16, 0.01, J.neck);
  J.head.add(ball(0.1, 0.115, 0.108, m.skin, 0, 0.01, 0));                          // crânio
  J.head.add(ball(0.078, 0.07, 0.08, m.skin, 0, -0.05, 0.022));                     // mandíbula
  const nose = mesh(new THREE.ConeGeometry(0.017, 0.05, 6), m.skin, 0, -0.012, 0.108);
  nose.rotation.x = Math.PI / 2 + 0.25; J.head.add(nose);
  for (const sd of [1, -1]) {
    J.head.add(ball(0.019, 0.013, 0.01, M.eyeWhite, 0.038 * sd, 0.016, 0.094));        // olho
    J.head.add(ball(0.009, 0.01, 0.006, M.iris, 0.038 * sd, 0.016, 0.102));            // íris
    const brow = box(0.038, 0.009, 0.012, m.hair, 0.039 * sd, 0.039, 0.098);
    brow.rotation.z = -0.15 * sd; J.head.add(brow);                                    // sobrancelha
    J.head.add(ball(0.014, 0.028, 0.02, m.skin, 0.1 * sd, 0.0, -0.005));              // orelha
  }
  J.head.add(box(0.032, 0.007, 0.01, m.lips, 0, -0.058, 0.096));                     // boca
  J.head.add(ball(0.072, 0.05, 0.055, m.hair, 0, -0.078, 0.045));                    // barba
  J.head.add(ball(0.04, 0.01, 0.015, m.hair, 0, -0.045, 0.1));                       // bigode
  J.hair = ball(0.108, 0.115, 0.118, m.hair, 0, 0.018, -0.006, DOME);
  J.hair.rotation.x = -0.18;
  J.head.add(J.hair);
  J.head.add(ball(0.1, 0.085, 0.065, m.hair, 0, -0.025, -0.065));                    // cabelo da nuca

  const arm = (side) => {
    const sh = group(0.19 * side, 0.45, 0, J.torso);
    sh.rotation.order = 'YXZ';                                                         // Y varre o golpe horizontal
    sh.add(ball(0.068, 0.062, 0.068, m.tunic, 0, -0.01, 0));                         // deltoide
    sh.add(mesh(limbGeo('uarm', 0.27, 0.058, 0.052, 0.042), m.tunic, 0, -0.01, 0));
    const el = group(0, -0.28, 0, sh);
    el.add(mesh(limbGeo('farm', 0.24, 0.044, 0.043, 0.032), m.skin, 0, 0, 0));
    el.add(mesh(latheGeo('bracer', [[0.038, 0], [0.046, 0.04], [0.044, 0.11]]), m.leather, 0, -0.23, 0));
    const hand = group(0, -0.26, 0, el);
    hand.add(ball(0.036, 0.046, 0.042, m.leather, 0, -0.03, 0.004));                // punho fechado (luva)
    const thumb = cap(0.012, 0.03, m.leather, -0.03 * side, -0.02, 0.028);
    thumb.rotation.x = 0.6; hand.add(thumb);
    const grip = group(0, -0.035, 0.0, hand);
    return [sh, el, hand, grip];
  };
  [J.shL, J.elL, J.handL] = arm(1);
  [J.shR, J.elR, J.handR, J.grip] = arm(-1);

  const leg = (side) => {
    const hp = group(0.085 * side, -0.03, 0, J.hips);
    hp.add(mesh(limbGeo('thigh', 0.44, 0.08, 0.072, 0.052), m.pants, 0, 0, 0));
    const kn = group(0, -0.44, 0, hp);
    kn.add(mesh(limbGeo('shin', 0.4, 0.056, 0.058, 0.042), m.boots, 0, 0, 0));
    kn.add(mesh(latheGeo('bootTop', [[0.064, 0], [0.068, 0.05]]), m.leather, 0, -0.12, 0));
    kn.add(ball(0.048, 0.036, 0.11, m.boots, 0, -0.42, 0.04));                      // pé
    return [hp, kn];
  };

function locomotionPose(t, blend, phase, run, armed) {
  const s = Math.sin(phase), c = Math.cos(phase);
  const b = Math.sin(t * 2.2);                 // respiração
  const idle = 1 - blend;
  const amp = run ? 0.95 : 0.7;
  const torsoRx = (run ? 0.2 : 0.06) * blend + 0.015 * b * idle;
  return {
    hipsY: (1 - Math.abs(s)) * 0.045 * blend - 0.02 * blend + 0.006 * b * idle,
    torsoRx, torsoRy: s * 0.14 * blend,
    neckRx: -torsoRx * 0.7 + 0.02 * b * idle,
    hipL: s * amp * blend, hipR: -s * amp * blend,
    knL: Math.max(0, -c) * 1.2 * blend + 0.05, knR: Math.max(0, c) * 1.2 * blend + 0.05,
    shLx: -s * amp * 0.7 * blend, shLy: 0, shLz: 0.1 + 0.025 * b * idle, elL: -0.18 - 0.35 * blend,
    shRx: armed ? -0.2 + s * amp * 0.4 * blend : s * amp * 0.7 * blend, shRy: 0,
    shRz: -0.1 - 0.025 * b * idle, elR: armed ? -0.6 : -0.18 - 0.35 * blend,
    wrR: armed ? 0.55 : 0, breathe: b * idle,
  };
}

function attackPose(base, a, u) {
  const times = [0, ...a.keys.map(k => k[0]), 1];
  const poses = [base, ...a.keys.map(k => k[1]), base];
  let i = 0;
  while (i < times.length - 2 && u > times[i + 1]) i++;
  const k = easeInOut(clamp((u - times[i]) / (times[i + 1] - times[i]), 0, 1));
  const out = { ...base };
  for (const f of a.fields) out[f] = lerp(poses[i][f] ?? base[f], poses[i + 1][f] ?? base[f], k);
  return out;
}

    if (r.state !== 'alive') continue;

const clock = new THREE.Clock();

function collide(pos, radius) {
  for (const o of obstacles) {
    if (!o.active) continue;
    const dx = pos.x - o.x, dz = pos.z - o.z, min = o.r + radius;
    const d2 = dx * dx + dz * dz;
    if (d2 < min * min && d2 > 1e-6) { const d = Math.sqrt(d2), k = (min - d) / d; pos.x += dx * k; pos.z += dz * k; }
  }
  pos.x = clamp(pos.x, -PLAY, PLAY); pos.z = clamp(pos.z, -PLAY, PLAY);
}

function updatePlayer(dt, t) {
  // --- movimento relativo à câmera ---
  let ix = 0, iz = 0;
  if (!player.dead) {
    if (keys.KeyW || keys.ArrowUp) iz += 1;
    if (keys.KeyS || keys.ArrowDown) iz -= 1;
    if (keys.KeyD || keys.ArrowRight) ix += 1;
    if (keys.KeyA || keys.ArrowLeft) ix -= 1;
    ix += joy.x; iz += joy.y;
  }
  const il = Math.hypot(ix, iz);
  if (il > 1) { ix /= il; iz /= il; }
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
  const rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
  const mx = fx * iz + rx * ix, mz = fz * iz + rz * ix;
  lastMove.x = mx; lastMove.z = mz;
  const run = (keys.ShiftLeft || keys.ShiftRight || Math.hypot(joy.x, joy.y) > 0.95) && il > 0.1;
  let speed = run ? 7 : 4.2;
  if (player.atk) speed *= 0.3;
  player.vel.x = damp(player.vel.x, mx * speed, 12, dt);
  player.vel.z = damp(player.vel.z, mz * speed, 12, dt);
  // avanço do golpe
  const [ffx, ffz] = facing();
  player.lunge = damp(player.lunge, 0, 9, dt);
  player.pos.x += (player.vel.x + ffx * player.lunge) * dt;
  player.pos.z += (player.vel.z + ffz * player.lunge) * dt;
  collide(player.pos, 0.3);
  player.pos.y = heightAt(player.pos.x, player.pos.z);
  const hs = Math.hypot(player.vel.x, player.vel.z);
  if (il > 0.1 && !player.atk && player.dodgeT <= 0) player.yaw = dampAngle(player.yaw, Math.atan2(mx, mz), 12, dt);
  player.dodgeCd -= dt;

  // --- animação ---
  const armed = !!equip.weapon;
  player.moveBlend = damp(player.moveBlend, clamp(hs / 4.2, 0, 1), 10, dt);
  player.walkPhase += dt * hs * 2.0;
  let P = locomotionPose(t, player.moveBlend, player.walkPhase, run, armed);
  let trailOn = false;
  player.comboWindow -= dt;
  if (player.atk) {
    const a = player.atk;
    const prevU = player.atkT / a.dur;
    player.atkT += dt;
    const u = player.atkT / a.dur;
    const k0 = a.keys[0][0], k1 = a.keys[a.keys.length - 1][0];
    if (prevU < k0 && u >= k0) player.lunge = a.lunge;                     // impulso ao soltar o golpe
    if (!player.atkHit && u >= a.hit) { player.atkHit = true; resolveHit(a); }
    trailOn = a.trail && u > k0 - 0.06 && u < k1 + 0.06;
    if (u >= 1) {
      player.atk = null; player.comboWindow = 0.55;
      if (player.queued) beginAttack();
    } else P = attackPose(P, a, u);
  }
  if (player.dodgeT > 0) {
    // pose agachada de esquiva (mistura com a pose atual)
    player.dodgeT -= dt;
    const k = Math.sin(clamp(1 - player.dodgeT / 0.38, 0, 1) * Math.PI);
    const D = { hipsY: -0.28, torsoRx: 0.7, neckRx: -0.4, hipL: -1.1, knL: 1.6, hipR: -0.3, knR: 1.3, shLx: 0.6, elL: -0.8, shRx: 0.5, elR: -0.9 };
    for (const f in D) P[f] = lerp(P[f], D[f], k);
  }
  applyPose(P);
  updateTrail(trailOn);
  J.cape.rotation.x = 0.08 + player.moveBlend * 0.55 + Math.sin(t * 7) * 0.05 * (0.3 + player.moveBlend);

  // morte / renascimento
  if (player.dead) {
    player.deadT += dt;
    J.hips.rotation.x = damp(J.hips.rotation.x, -1.45, 8, dt);
    J.hips.position.y = damp(J.hips.position.y, 0.3, 8, dt);
    if (player.deadT > 2.5) {
      player.dead = false; player.hp = player.maxHp; player.pos.set(0, 0, 0); player.vel.set(0, 0, 0);
      J.hips.rotation.x = 0; player.invuln = 2; player.blinkT = 2;
      $('death').style.display = 'none'; refreshUI();
    }
  } else J.hips.rotation.x = 0;

  J.root.position.copy(player.pos);
  J.root.rotation.y = player.yaw;

  // vida: invulnerabilidade, regeneração, flash
  player.invuln = Math.max(0, player.invuln - dt);
  if (!player.dead && player.hp < player.maxHp && t - player.lastHurt > 5) {
    player.regenT += dt;
    if (player.regenT > 2.5) { player.regenT = 0; player.hp = Math.min(player.maxHp, player.hp + 1); refreshUI(); }
  }
  if (player.flash > 0) { player.flash = Math.max(0, player.flash - dt * 4); setFlash(J.root, player.flash); }
  else if (player.blinkT > 0 && !player.dead) { player.blinkT -= dt; J.root.visible = Math.floor(t * 15) % 2 === 0 || player.blinkT < 0.1; }

  // "pop" do equipamento recém-equipado
  for (const s in equipMesh) {
    const m = equipMesh[s];
    if (m && m.userData.pop < 1) {
      m.userData.pop = Math.min(1, m.userData.pop + dt * 3);
      const k = m.userData.pop;
      m.scale.setScalar(Math.max(0.01, k + Math.sin(k * Math.PI) * 0.35));
    }
  }
}

function updateMobs(dt, t) {
  for (let i = mobs.length - 1; i >= 0; i--) {
    const m = mobs[i];
    if (m.dead) {
      m.deadT += dt;
      const k = clamp(m.deadT / 0.6, 0, 1);
      m.J.root.scale.setScalar(Math.max(0.01, 1 - k));
      m.J.root.rotation.z = k * 1.2;
      m.J.root.position.y = m.pos.y + Math.sin(k * Math.PI) * 0.5;
      if (k >= 1) { scene.remove(m.J.root); scene.remove(m.bar); mobs.splice(i, 1); }
      continue;
    }
    if (m.spawnT < 1) { m.spawnT = Math.min(1, m.spawnT + dt * 2); m.J.root.scale.setScalar(Math.max(0.01, easeInOut(m.spawnT))); }

    const T = m.T;
    const dx = player.pos.x - m.pos.x, dz = player.pos.z - m.pos.z, dist = Math.hypot(dx, dz);
    let mvx = 0, mvz = 0;
    m.atkCd -= dt; m.stun -= dt;

    if (player.dead) m.state = 'wander';
    else if (m.state !== 'chase' && dist < T.aggro) m.state = 'chase';
    else if (m.state === 'chase' && (dist > T.aggro * 1.8 || Math.hypot(m.pos.x - m.home.x, m.pos.z - m.home.y) > 34)) m.state = 'wander';

    if (m.atkT >= 0) {
      m.atkT += dt;
      if (!m.atkHit && m.atkT > 0.3) { m.atkHit = true; if (dist < T.range + 0.7) hurtPlayer(T.dmg); }
      if (m.atkT > 0.6) { m.atkT = -1; m.atkCd = 1.1 + Math.random() * 0.5; }
      m.yaw = dampAngle(m.yaw, Math.atan2(dx, dz), 8, dt);
    } else if (m.stun <= 0) {
      if (m.state === 'chase') {
        m.yaw = dampAngle(m.yaw, Math.atan2(dx, dz), 8, dt);
        if (dist > T.range * 0.85) { mvx = dx / dist; mvz = dz / dist; }
        else if (m.atkCd <= 0) { m.atkT = 0; m.atkHit = false; }
      } else {
        m.wait -= dt;
        if (!m.wanderTo && m.wait <= 0) {
          m.wanderTo = new THREE.Vector2(clamp(m.home.x + (Math.random() - .5) * 14, -PLAY, PLAY), clamp(m.home.y + (Math.random() - .5) * 14, -PLAY, PLAY));
        }
        if (m.wanderTo) {
          const wx = m.wanderTo.x - m.pos.x, wz = m.wanderTo.y - m.pos.z, wd = Math.hypot(wx, wz);
          if (wd < 0.6) { m.wanderTo = null; m.wait = 1 + Math.random() * 3; }
          else { mvx = wx / wd * 0.45; mvz = wz / wd * 0.45; m.yaw = dampAngle(m.yaw, Math.atan2(wx, wz), 5, dt); }
        }
      }
    }
    let sp = T.speed;
    if (m.type === 'slime') sp *= m.air > 0.05 ? 1.7 : 0.15;
    m.vel.x = damp(m.vel.x, mvx * sp, 10, dt);
    m.vel.y = damp(m.vel.y, mvz * sp, 10, dt);
    m.kb.multiplyScalar(Math.exp(-8 * dt));
    m.pos.x += (m.vel.x + m.kb.x) * dt;
    m.pos.z += (m.vel.y + m.kb.y) * dt;
    for (const o of mobs) {
      if (o === m || o.dead) continue;
      const ox = m.pos.x - o.pos.x, oz = m.pos.z - o.pos.z, od = Math.hypot(ox, oz);
      if (od < 1 && od > 1e-4) { m.pos.x += ox / od * (1 - od) * 0.5; m.pos.z += oz / od * (1 - od) * 0.5; }
    }
    if (dist < 0.9 && dist > 1e-4) { m.pos.x -= dx / dist * (0.9 - dist); m.pos.z -= dz / dist * (0.9 - dist); }
    collide(m.pos, 0.4);
    m.pos.y = heightAt(m.pos.x, m.pos.z);

    const speed01 = clamp(Math.hypot(m.vel.x, m.vel.y) / T.speed, 0, 1);
    animateMob(m, dt, m.type === 'slime' ? Math.max(speed01, Math.hypot(mvx, mvz)) : speed01, t);
    m.J.root.position.copy(m.pos);
    m.J.root.rotation.y = m.yaw;

    if (m.flash > 0) { m.flash = Math.max(0, m.flash - dt * 4); setFlash(m.J.root, m.flash); }
    m.barShow -= dt;
    m.bar.visible = m.barShow > 0;
    if (m.bar.visible) {
      m.bar.position.set(m.pos.x, m.pos.y + T.h + 0.25, m.pos.z);
      m.bar.quaternion.copy(camera.quaternion);
      m.barFill.scale.x = Math.max(0.001, m.hp / T.hp);
    }
  }
  for (let i = respawnQueue.length - 1; i >= 0; i--) {
    if (t > respawnQueue[i].at) { spawnMob(respawnQueue[i].type); respawnQueue.splice(i, 1); }
  }
}

function updateCamera(dt) {
  camDist = damp(camDist, camDistT, 8, dt);
  // celular: a câmera volta suavemente para trás do personagem enquanto ele anda
  if (IS_TOUCH && camTouch.id === null && !invOpen && !player.dead && Math.hypot(joy.x, joy.y) > 0.2)
    camYaw = dampAngle(camYaw, player.yaw + Math.PI, 1.3 * player.moveBlend, dt);
  camTarget.set(player.pos.x, player.pos.y + 1.45, player.pos.z);
  const cp = Math.cos(camPitch);
  let cx = camTarget.x + Math.sin(camYaw) * cp * camDist;
  let cz = camTarget.z + Math.cos(camYaw) * cp * camDist;
  let cy = camTarget.y + Math.sin(camPitch) * camDist;
  cy = Math.max(cy, heightAt(cx, cz) + 0.6);
  if (camShake > 0) {
    camShake = Math.max(0, camShake - dt * 1.5);
    cx += (Math.random() - .5) * camShake; cy += (Math.random() - .5) * camShake; cz += (Math.random() - .5) * camShake;
  }
  camera.position.set(cx, cy, cz);
  camera.lookAt(camTarget);
  sun.position.copy(player.pos).add(SUN_OFFSET);
  sun.target.position.copy(player.pos);
}

// Ajuste automático de resolução conforme o FPS médio
let qT = 0, qFrames = 0, qChecks = 0;
function autoQuality(dt) {
  if (pixelMode || !started) return;
  qT += dt; qFrames++;
  if (qT < 2.5) return;
  const fps = qFrames / qT; qT = 0; qFrames = 0; qChecks++;
  if (fps < 40 && dprIdx < DPR_STEPS.length - 1) { dprIdx++; resize(); }
  else if (fps > 58 && qChecks > 2 && dprIdx > 0 && DPR_STEPS[dprIdx - 1] <= (devicePixelRatio || 1)) { dprIdx--; resize(); qChecks = 0; }
}
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  // inventário aberto pausa o mundo; hitStop dá peso ao impacto
  const portrait = IS_TOUCH && innerHeight > innerWidth;
  let gdt = invOpen || portrait ? 0 : dt;
  if (atkHeld && !portrait) startAttack();
  autoQuality(dt);
  $('btnDodge').classList.toggle('cd', player.dodgeCd > 0);
  if (hitStop > 0) { hitStop -= dt; gdt *= 0.08; }
  now += gdt;

  updatePlayer(gdt, now);
  updateMobs(gdt, now);
  updateResources(gdt, now);
  updatePickups(gdt, now);
  updateParticles(gdt);
  updateCamera(dt);
  updateFloats(gdt);

  campfire.flames.forEach((f, i) => {
    const s = (i ? 0.6 : 1) * (1 + Math.sin(now * 13 + i * 2) * 0.15);
    f.scale.set(s, s * (1 + Math.sin(now * 17 + i) * 0.2), s);
    f.rotation.y = now * (i ? -3 : 2);
  });
  for (const c of clouds) { c.position.x += gdt * 0.8; if (c.position.x > 100) c.position.x = -100; }

  if (vignette > 0) { vignette = Math.max(0, vignette - dt * 2); $('vignette').style.opacity = vignette; }
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('toast').style.display = 'none'; }
  if (helpTimer > 0) { helpTimer -= dt; if (helpTimer <= 0) $('controls').classList.add('hide'); }
  hintTimer -= dt;
  if (hintTimer <= 0) { hintTimer = 0.12; updateHint(); }

  renderer.render(scene, camera);
}

buildInvUI();
inv.items.club = true;
equipItem('club');
refreshUI();
window.__gameStarted = true;
window.__game = { player, mobs, resources, inv, equip, craft, equipItem, startAttack, hurtPlayer, toggleInv,
  setCam: (y, p, d) => { camYaw = y; camPitch = p; camDist = camDistT = d; } };
loop();
</script>
