<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neve Zero — Limpe o Vale</title>
<style>
  :root{
    --bg:#16304f; --bg2:#1f416a; --line:rgba(190,225,255,.22);
    --txt:#f2f8ff; --mut:#a6bfd8; --ice:#7fd8ff; --gold:#ffd166; --red:#ff6b6b; --green:#7be495; --ink:#1b2a3c;
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe6fb;color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;
    touch-action:none;-webkit-touch-callout:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
  .ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex-shrink:0}
  button{font:inherit;cursor:pointer;color:var(--txt);border:0;background:none;padding:0}
  .gbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:92px;padding:8px 12px;border-radius:12px;
    font-weight:900;font-size:13px;color:#3b2500;background:linear-gradient(#ffe68a,#ffb627);border-bottom:4px solid #b9770e;
    box-shadow:0 3px 0 rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .gbtn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
  .gbtn.blue{color:#06263a;background:linear-gradient(#bff0ff,#59c3ee);border-bottom-color:#2a7fb0}
  .gbtn.gray,.gbtn:disabled{color:#c9d6e3;background:linear-gradient(#5b6f86,#41546b);border-bottom-color:#2b3a4c;text-shadow:none;cursor:default}
  .gbtn.green{color:#063a14;background:linear-gradient(#b8f5c4,#4fcf6a);border-bottom-color:#258a3c}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #stats{position:absolute;left:calc(10px + var(--safe-l));top:calc(10px + var(--safe-t));display:flex;flex-direction:column;gap:6px;max-width:280px}
  .pill{background:rgba(10,26,46,.6);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:4px 11px;font-size:13px;font-weight:800;
    text-shadow:0 1px 2px #000;align-self:flex-start;display:flex;align-items:center;gap:6px}
  #coinsPill{font-size:21px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #7a4a00}
  #coinsPill.bump{animation:cbump .35s}
  @keyframes cbump{40%{transform:scale(1.25);filter:brightness(1.35)}}
  .bar{position:relative;width:210px;height:22px;border-radius:12px;background:rgba(10,26,46,.65);border:2px solid rgba(255,255,255,.6);overflow:hidden}
  .bar .fill{position:absolute;inset:0;width:0;background:linear-gradient(#ffffff,#8fdcff 60%,#59b9ea);transition:width .12s}
  .bar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:900;color:#06263a;text-shadow:0 0 3px rgba(255,255,255,.9)}
  #bagBar.pop{animation:bpop .18s}
  @keyframes bpop{50%{transform:scale(1.06)}}
  #bagBar.full .fill{background:linear-gradient(#ffd0d0,#ff6b6b);animation:pulse .6s infinite alternate}
  #fuelBar{display:none}
  #fuelBar .fill{background:linear-gradient(#fff2b0,#ffb627)}
  @keyframes pulse{to{filter:brightness(1.35)}}
  #objective{font-size:12px;font-weight:800;color:#fff;background:rgba(40,110,170,.65);border-color:rgba(127,216,255,.6)}
  #objective:empty{display:none}
  #topRight{position:absolute;right:calc(10px + var(--safe-r));top:calc(10px + var(--safe-t));display:flex;gap:8px;pointer-events:auto}
  .iconbtn{width:44px;height:44px;border-radius:50%;background:rgba(10,26,46,.55);border:2px solid rgba(255,255,255,.35);font-size:22px;display:flex;align-items:center;justify-content:center}
  #cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
  #combo{position:absolute;left:50%;top:calc(50% - 72px);transform:translateX(-50%);font-size:22px;font-weight:900;color:#fff;
    text-shadow:0 0 10px rgba(80,190,255,.95),0 2px 0 #0a3550;opacity:0;transition:opacity .25s;white-space:nowrap}
  #combo.on{opacity:1}
  #combo.lv{animation:lv .3s}
  @keyframes lv{40%{transform:translateX(-50%) scale(1.5)}}
  #section{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);display:none;align-items:center;gap:6px;
    padding:3px 10px 3px 6px;border-radius:12px;background:rgba(10,26,46,.6);font-size:12px;font-weight:900;white-space:nowrap}
  #section .ring{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--ice) var(--p,0%), rgba(255,255,255,.18) 0)}
  #ctx{position:absolute;left:50%;top:calc(50% + 50px);transform:translateX(-50%);padding:5px 12px;border-radius:12px;display:none;
    background:rgba(10,26,46,.7);border:2px solid var(--gold);font-size:13px;font-weight:900;white-space:nowrap;align-items:center;gap:6px}
  #toast{position:absolute;left:50%;top:calc(12px + var(--safe-t));transform:translateX(-50%);padding:8px 16px;border-radius:14px;
    background:rgba(16,40,70,.92);border:2px solid var(--line);font-size:13px;font-weight:700;display:none;text-align:center;max-width:calc(100vw - 360px)}
  #help{position:absolute;left:50%;bottom:calc(10px + var(--safe-b));transform:translateX(-50%);padding:8px 12px;border-radius:12px;
    background:rgba(10,26,46,.55);font-size:12px;line-height:1.6;text-align:center;max-width:min(520px,calc(100vw - 360px));transition:opacity .6s}
  #help.hide{opacity:0}
  #help b{color:var(--ice)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(255,255,255,0) 40%,rgba(160,225,255,.55) 100%);opacity:0}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .ft{position:absolute;left:0;top:0;white-space:nowrap;font-weight:900;text-shadow:0 0 4px rgba(0,0,0,.7),1px 2px 0 rgba(0,0,0,.6);will-change:transform,opacity;display:flex;align-items:center;gap:4px}

  /* ---------- loja (visual de jogo) ---------- */
  .modalWrap{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,10,25,.55);
    padding:calc(8px + var(--safe-t)) calc(8px + var(--safe-r)) calc(8px + var(--safe-b)) calc(8px + var(--safe-l))}
  .modalWrap.open{display:flex}
  .modal{width:100%;max-width:960px;height:100%;max-height:620px;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;
    background:linear-gradient(#1d3d63,#12263f);border:3px solid #6fc6ff;box-shadow:0 0 0 4px var(--ink),0 14px 40px rgba(0,0,0,.6)}
  .modal header{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;background:linear-gradient(#2b5a8e,#1d4370);border-bottom:3px solid var(--ink)}
  .modal header h2{margin:0 6px 0 0;font-size:18px;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 0 var(--ink);white-space:nowrap}
  .tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
  .tab{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;font-weight:900;font-size:13px;color:#cfe6ff;
    background:rgba(0,0,0,.25);border:2px solid transparent;white-space:nowrap}
  .tab.on{background:linear-gradient(#bff0ff,#59c3ee);color:#06263a;border-color:var(--ink)}
  .tab .ic{width:20px;height:20px}
  .coinsTag{display:flex;align-items:center;gap:5px;font-weight:900;font-size:17px;color:var(--gold);text-shadow:0 2px 0 #7a4a00;padding:0 6px;white-space:nowrap}
  .closeBtn{width:40px;height:40px;border-radius:50%;background:linear-gradient(#ff8a8a,#e04848);border:3px solid var(--ink);color:#fff;font-weight:900;font-size:18px;flex-shrink:0}
  .page{flex:1;overflow:auto;padding:12px 14px 16px;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:none}
  .page.on{display:block}
  .secTitle{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#9fd6ff;margin:4px 2px 8px;display:flex;align-items:center;gap:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-bottom:14px}
  .card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 10px 12px;border-radius:16px;text-align:center;
    background:linear-gradient(#2a5585,#1b3b60);border:3px solid var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.15)}
  .card.on{background:linear-gradient(#3a8fc4,#22618f);box-shadow:inset 0 0 0 2px #bff0ff}
  .card .badge{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(#ffffff 0%,#cfe9ff 70%);border:3px solid var(--ink)}
  .card .badge .ic{width:40px;height:40px;vertical-align:0}
  .card b{font-size:13.5px;font-weight:900;text-shadow:0 1px 0 var(--ink)}
  .card small{font-size:11px;color:#bcd6ee;line-height:1.3;min-height:28px}
  .stats{width:100%;display:flex;flex-direction:column;gap:3px}
  .stat{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:800;color:#bcd6ee}
  .stat span{width:44px;text-align:left}
  .stat i{flex:1;height:7px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden;position:relative}
  .stat i::after{content:"";position:absolute;inset:0;width:var(--v);background:linear-gradient(90deg,#7be495,#7fd8ff)}
  .tag{position:absolute;top:6px;right:6px;font-size:10px;font-weight:900;padding:2px 6px;border-radius:8px;background:#ffd166;color:#3b2500;border:2px solid var(--ink)}
  .need{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
  .need span{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:900;padding:2px 6px;border-radius:9px;background:rgba(0,0,0,.3)}
  .need span.ok{color:#9ff0b0}.need span.no{color:#ff9d9d}
  /* árvore de habilidades */
  .tree{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;min-width:560px}
  .branch{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px 10px;border-radius:16px;background:rgba(0,0,0,.18)}
  .branch h4{margin:0 0 6px;font-size:13px;font-weight:900;color:#9fd6ff;letter-spacing:.06em;text-transform:uppercase}
  .link{width:6px;height:18px;background:#0f2238;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
  .link.on{background:#7fd8ff}
  .node{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
  .node .orb{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid var(--ink);
    background:radial-gradient(circle at 35% 30%,#ffffff,#9ed8ff 60%,#4a97cf);box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .node .orb .ic{width:40px;height:40px;vertical-align:0}
  .node.locked .orb{filter:grayscale(1) brightness(.55)}
  .node.max .orb{background:radial-gradient(circle at 35% 30%,#fff7c8,#ffd34d 60%,#d9930f)}
  .node b{font-size:12px;font-weight:900;text-shadow:0 1px 0 var(--ink)}
  .pips{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:110px}
  .pips i{width:7px;height:7px;border-radius:2px;background:rgba(0,0,0,.4);border:1px solid var(--ink)}
  .pips i.on{background:#7be495}
  .node small{font-size:10px;color:#bcd6ee;max-width:130px;line-height:1.25}
  .node .gbtn{min-width:84px;padding:6px 8px;font-size:12px}
  .settings{margin-top:10px}
  #win .modal{max-width:440px;height:auto;text-align:center}
  #win .body{padding:18px 20px;line-height:1.55;font-size:14px;color:#cfe3f7}
  #win .body b{color:#fff}
  #win .actions{display:flex;gap:10px;justify-content:center;padding:0 20px 18px;flex-wrap:wrap}

  /* ---------- toque ---------- */
  #touchUI{position:fixed;inset:0;pointer-events:none;z-index:6;display:none}
  body.touch #touchUI{display:block}
  body.touch .tbtn, body.touch #topRight{pointer-events:none}
  #joyBase{position:absolute;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(10,26,46,.18);display:none}
  #joyBase.idle{display:block;opacity:.45;left:calc(98px + var(--safe-l));top:calc(100% - 98px - var(--safe-b))}
  #joyKnob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.8)}
  .tbtn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
    touch-action:none;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(10,26,46,.55));border:4px solid rgba(255,255,255,.7);transition:transform .08s}
  .tbtn .ic{width:60%;height:60%;vertical-align:0}
  #btnAct{right:calc(28px + var(--safe-r));bottom:calc(26px + var(--safe-b));width:100px;height:100px}
  #btnHeat{right:calc(140px + var(--safe-r));bottom:calc(30px + var(--safe-b));width:70px;height:70px;display:none;border-color:#ffb36b}
  .tbtn.pressed, .iconbtn.pressed{transform:scale(.88);background:rgba(127,216,255,.55)}
  #rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#0c1a2c;color:var(--txt);font-size:17px;text-align:center;padding:24px}
  #rotate .ph{font-size:56px;animation:rot 1.6s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){ body.touch #rotate{display:flex} }
  #start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,30,60,.25)}
  #start .box{background:linear-gradient(#1d3d63,#12263f);border:3px solid #6fc6ff;box-shadow:0 0 0 4px var(--ink);border-radius:20px;padding:22px 28px;text-align:center;max-width:min(440px,calc(100vw - 32px))}
  #start h1{margin:0 0 4px;font-size:34px;letter-spacing:3px;text-shadow:0 0 18px rgba(127,216,255,.7),0 3px 0 #0a3550}
  #start p{margin:6px 0 16px;font-size:14px;color:#bcd6ee;line-height:1.5}
  #start .gbtn{font-size:18px;padding:11px 36px}
  #err{position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#300;color:#fbb;padding:8px;font-size:12px;white-space:pre-wrap;display:none;max-height:40vh;overflow:auto;font-family:monospace}
</style>
</head>
<body>
<div id="hud">
  <div id="stats">
    <div class="pill" id="coinsPill"><span class="ico-coin"></span><span id="coins">0</span></div>
    <div class="bar" id="bagBar"><div class="fill"></div><div class="txt" id="bagText"></div></div>
    <div class="bar" id="fuelBar"><div class="fill"></div><div class="txt" id="fuelText"></div></div>
    <div class="pill" id="prog"></div>
    <div class="pill" id="objective"></div>
  </div>
  <div id="topRight"><button class="iconbtn" id="btnSound"></button><button class="iconbtn" id="btnHelp"></button></div>
  <div id="cross"></div>
  <div id="combo"></div>
  <div id="section"><div class="ring"></div><span id="secText"></span></div>
  <div id="ctx"></div>
  <div id="toast"></div>
  <div id="help"></div>
</div>
<div id="flash"></div>
<div id="fx"></div>

<div class="modalWrap" id="shop">
  <div class="modal">
    <header>
      <h2 id="shopTitle">Loja</h2>
      <div class="tabs" id="tabs"></div>
      <div class="coinsTag" id="shopCoins"></div>
      <button class="closeBtn" id="shopClose">✕</button>
    </header>
    <div class="page" id="pg-loja"></div>
    <div class="page" id="pg-bancada"></div>
    <div class="page" id="pg-arvore"></div>
    <div class="page" id="pg-mochila"></div>
  </div>
</div>
<div class="modalWrap" id="win">
  <div class="modal">
    <header><h2>Vale limpo!</h2></header>
    <div class="body" id="winBody"></div>
    <div class="actions"><button class="gbtn gray" id="winKeep">Continuar</button><button class="gbtn blue" id="winPrestige">Nova nevasca</button></div>
  </div>
</div>
<div id="touchUI">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <button id="btnHeat" class="tbtn"></button>
  <button id="btnAct" class="tbtn"></button>
</div>
<div id="start"><div class="box">
  <h1>NEVE ZERO</h1>
  <p>Uma vila rural sumiu debaixo da neve. Comece com as mãos, ache peças e veículos enterrados,
     fabrique ferramentas absurdas e limpe tudo até não sobrar um floco.</p>
  <button id="btnStart" class="gbtn blue">JOGAR</button>
</div></div>
<div id="rotate"><div class="ph">📱</div>Gire o celular para jogar na horizontal</div>
<div id="err"></div>

<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('err'); el.style.display = 'block';
    el.textContent += '[Erro] ' + (e.message || e) + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : '') + '\n';
  });
  setTimeout(function () { if (!window.__gameStarted) { var el = document.getElementById('err'); el.style.display = 'block';
    el.textContent += 'Não foi possível iniciar o jogo. Verifique a conexão (o Three.js vem de unpkg.com).\n'; } }, 15000);
</script>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

/* =====================================================================
   UTILITÁRIOS
   ===================================================================== */
const TAU = Math.PI * 2;
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (IS_TOUCH) document.body.classList.add('touch');
let seed = 7341;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a, b) => a + rnd() * (b - a);
const fr = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const $ = id => document.getElementById(id);
function fmt(n) { n = Math.floor(n); if (n < 1000) return String(n); const u = ['K', 'M', 'B', 'T']; let i = -1; while (n >= 1000 && i < 3) { n /= 1000; i++; } return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)) + u[i]; }
const vibrate = ms => { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (_) {} } };

/* =====================================================================
   ÍCONES DESENHADOS EM CÓDIGO (SVG cartunesco, sem emojis)
   ===================================================================== */
const O = 'stroke="#1b2a3c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';
const sv = b => `<svg viewBox="0 0 64 64" class="ic">${b}</svg>`;
const ln = (d, c, w = 5) => `<path d="${d}" fill="none" stroke="#1b2a3c" stroke-width="${w + 4}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const shovelIc = c => sv(ln('M46 6L30 36', '#b07a45', 5) + `<path d="M18 32l17 8-6 15c-6 2-13-2-15-9z" fill="${c}" ${O}/>` + ln('M41 4l10 5', '#222831', 5));
const ICON = {
  coin: sv(`<circle cx="32" cy="32" r="25" fill="#ffcc33" ${O}/><circle cx="32" cy="32" r="16" fill="none" stroke="#d99a10" stroke-width="3"/><path d="M32 22v20M26 28h12" stroke="#d99a10" stroke-width="5" stroke-linecap="round"/>`),
  snow: sv(ln('M32 8v48M11 20l42 24M11 44l42-24M26 12l6 6 6-6M26 52l6-6 6 6', '#c9f1ff', 5)),
  star: sv(`<path d="M32 6l7.6 16.4 17.9 2.1-13.2 12.2 3.5 17.7L32 45.6 16.2 54.4l3.5-17.7L6.5 24.5l17.9-2.1z" fill="#ffd34d" ${O}/>`),

    if (Math.random() < 0.6) spawn(coins3, MELT.x + fr(-0.4, 0.4), 2.9, MELT.z + fr(-0.4, 0.4), fr(-2, 2), fr(4, 7), fr(-2, 2), 1, 1.4);
  }
  sellT -= dt;
  if (sellT <= 0) { sellT = 0.4; if (sellAcc >= 1) { floatText(`+${fmt(sellAcc)}`, dm < 4.5 ? new THREE.Vector3(MELT.x, 3.1, MELT.z) : camera.position.clone().addScaledVector(_dir, 1.6).setY(camera.position.y + 0.3), '#ffd166', 22, 'coin'); bumpCoins(); if (selling) chime(880 + Math.random() * 100); else tone(880, 1320, 0.05, 0.18); sellAcc = 0; } }
  melterDoor.material.color.setHSL(0.07, 1, 0.5 + 0.12 * Math.sin(t * 6) + (selling ? 0.12 : 0)); melter.userData.light.intensity = (selling ? 8 : 4) + Math.sin(t * 7) * 0.6;
  if (Math.random() < dt * 1.5) emitSteam(MELT.x + 0.75, 4.4, MELT.z + 0.4, fr(-.2, .2), 1.2, fr(-.2, .2), 2.2);

  // --- robôs, moedas e peças enterradas ---
  updateRobots(dt, t);
  robotT -= dt; if (robotT <= 0) { robotT = 4; if (robotIncome >= 1 && robots.length) { floatText(`+${fmt(robotIncome)}`, camera.position.clone().add(new THREE.Vector3(0, 0.6, 0)).addScaledVector(_dir, 2), '#9fe6ff', 15, 'robot'); robotIncome = 0; bumpCoins(); } }
  treasureT -= dt;
  if (treasureT <= 0) {
    treasureT = 0.2;
    for (const tr of treasures) { if (tr.found) { tr.m.visible = false; continue; } tr.m.visible = depth[tr.k] < 0.14;
      if (tr.m.visible && Math.hypot(player.x - tr.x, player.z - tr.z) < 1.6) { tr.found = true; tr.m.visible = false; const c = tr.value * stat.value(); state.coins += c; bumpCoins(); floatText(`+${fmt(c)}`, tr.m.position.clone().setY(tr.m.position.y + 0.8), '#ffd166', 24, 'coin'); for (let n = 0; n < 12; n++) spawn(coins3, tr.x, tr.m.position.y, tr.z, fr(-2, 2), fr(4, 7), fr(-2, 2), 1, 1.4); chime(784, 5); vibrate(20); } }
    for (const it of items) { if (it.found) { it.g.visible = false; continue; } it.g.visible = depth[it.k] < 0.3 && !iceA[it.k];
      if (it.g.visible && Math.hypot(player.x - it.x, player.z - it.z) < (drv ? 3 : 1.8)) { it.found = true; it.g.visible = false; state.inv[it.part]++; floatText(PARTS[it.part], it.g.position.clone().setY(it.g.position.y + 1), '#bff4ff', 22, it.part); toast(`Peça encontrada: ${PARTS[it.part]}!`, 3, it.part); chime(659, 6); vibrate([20, 30, 20]);
        for (let n = 0; n < 14; n++) spawn(stars, it.x, it.g.position.y, it.z, fr(-2, 2), fr(3, 6), fr(-2, 2), fr(0.06, 0.1), 1.1); } }
  }
  for (const tr of treasures) if (tr.m.visible) { tr.m.rotation.y += dt * 2; tr.m.position.y = groundAt(tr.x, tr.z) + 0.34 + Math.sin(t * 3 + tr.x) * 0.06; }
  for (const it of items) if (it.g.visible) { it.g.rotation.y += dt * 1.5; it.g.position.y = groundAt(it.x, it.z) + 0.4 + Math.sin(t * 3 + it.x) * 0.08; }

  flames.forEach((f, i) => { const s = (i ? 0.7 : 1) * (1 + Math.sin(t * 13 + i * 2) * 0.15); f.scale.set(s, s * (1 + Math.sin(t * 17 + i) * 0.2), s); });
  fireLight.intensity = 16 * (1 + Math.sin(t * 23) * 0.08);
  if (Math.random() < dt * 3) emitSteam(4.4 + fr(-.2, .2), 8.7, -2.4, fr(-.15, .15) + 0.2, 1.0, fr(-.15, .15), 3.0);
  boardT -= dt; if (boardT <= 0) { boardT = 2; if (inHouse()) drawBoard(); }
  zoneT -= dt;
  if (zoneT <= 0) {
    zoneT = 0.8; zoneFrac = zoneSnowFraction();
    if (dispZone() >= 100 && zoneDone !== state.zone) { zoneDone = state.zone; if (state.zone < ZONES.length - 1) { toast(`Zona ${state.zone + 1} 100% limpa! Compre a próxima zona na loja.`, 4.5, 'star'); chime(523, 6); } }
    if (!state.won && pct() >= 98.5) showWin();
  }
  hudT -= dt; if (hudT <= 0) { hudT = 0.1; refreshHUD(); }
  saveT -= dt; if (saveT <= 0) { saveT = 10; save(); }
  state.played += dt;
}
function spray(hit, vol, tool) {
  const n = clamp(Math.ceil(vol * 45), 1, tool.direct ? 9 : 5), hx = hit.x - camera.position.x, hz = hit.z - camera.position.z, hl = Math.hypot(hx, hz) || 1, R = stat.radius();
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * R * 0.85, x = hit.x + Math.cos(a) * r, z = hit.z + Math.sin(a) * r, y = hit.y + 0.05;
    if (tool.id === 'heat') { if (Math.random() < 0.5) emitSteam(x, y, z, fr(-.3, .3), fr(1.2, 2.2), fr(-.3, .3), 1.4); }
    else if (tool.direct) spawn(bits, x, y, z, Math.cos(a + 1.6) * 4, fr(2, 4), Math.sin(a + 1.6) * 4, fr(0.035, 0.08), 2.2, fr(0.05, 0.2));
    else if (tool.reach > 5) spawn(bits, x, y, z, fr(-1, 1), fr(1, 2.5), fr(-1, 1), fr(0.03, 0.065), 2.2, fr(0.02, 0.12));
    else spawn(bits, x, y, z, -hx / hl * fr(0.3, 1.2) + fr(-1.3, 1.3), fr(2.5, 4.5), -hz / hl * fr(0.3, 1.2) + fr(-1.3, 1.3), fr(0.035, 0.085), 2.2, fr(0.25, 0.45));
  }
  puffT -= 0.02; if (puffT <= 0 && tool.id !== 'heat') { puffT = 0.12; spawn(puffs, hit.x + fr(-0.3, 0.3) * R, hit.y + 0.15, hit.z + fr(-0.3, 0.3) * R, fr(-0.8, 0.8), fr(0.6, 1.4), fr(-0.8, 0.8), R * fr(0.35, 0.6), fr(0.5, 0.8)); }
}
let qT = 0, qF = 0, qN = 0;
function autoQuality(dt) { if (!started) return; qT += dt; qF++; if (qT < 2.5) return; const f = qF / qT; qT = 0; qF = 0; qN++; if (f < 40 && dprIdx < DPR_STEPS.length - 1) { dprIdx++; resize(); } else if (f > 58 && qN > 2 && dprIdx > 0 && DPR_STEPS[dprIdx - 1] <= (devicePixelRatio || 1)) { dprIdx--; resize(); qN = 0; } }
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05), portrait = IS_TOUCH && innerHeight > innerWidth;
  const paused = !started || shopOpen || portrait || $('win').classList.contains('open');
  if (!paused) { update(dt, clock.elapsedTime); updateDay(dt); }
  else { camera.position.set(player.x, player.y + 1.62, player.z); camera.rotation.set(player.pitch, player.yaw, 0); if (!started) { player.yaw += dt * 0.05; updateDay(dt * 4); } }
  skyU.uTime.value = clock.elapsedTime; if (snowMat.userData.sh) snowMat.userData.sh.uniforms.uNight.value = DAY.night;
  updateBits(dt); updateSimple(puffs, dt, -0.2, 'puff'); updateSimple(stars, dt, 6, 'star'); updateSimple(coins3, dt, 12, 'coin'); updateSimple(fires, dt, -2, 'fire');
  updateWaves(dt); updateSteam(dt); updateSnowfall(dt, clock.elapsedTime); updateFloats(dt); tickCoins(dt); flushSnow();
  sky.position.copy(camera.position);
  sun.position.set(player.x, 0, player.z).addScaledVector(DAY.lightDir, 80); sun.target.position.set(player.x, 0, player.z);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').style.display = 'none'; }
  if (helpT > 0) { helpT -= dt; if (helpT <= 0) $('help').classList.add('hide'); }
  autoQuality(dt);
  renderer.render(scene, camera);
}

/* ---------- início ---------- */
const loaded = load();
buildFence(); syncRobots(); equipTool(state.tool); equipHeat(state.heat); markAll(); updateDay(0);
VEH.forEach(v => { v.beam.visible = !v.st.fixed; });
drawBoard();
$('btnSound').innerHTML = ic(state.muted ? 'mute' : 'sound');
$('coins').textContent = fmt(state.coins);
if (!loaded) { player.x = 3; player.z = 18; player.yaw = Math.PI * 1.12; player.pitch = -0.02; player.y = groundAt(3, 18) + 0.5; }
else $('btnStart').textContent = 'CONTINUAR';
$('btnStart').addEventListener('click', () => {
  started = true; $('start').style.display = 'none';
  if (!loaded) { player.x = 0; player.z = -1.5; player.yaw = Math.PI; player.pitch = -0.08; player.y = 0; }
  initAudio(); requestLock();
  if (IS_TOUCH) { const el = document.documentElement; try { const f = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : (el.webkitRequestFullscreen && el.webkitRequestFullscreen()); Promise.resolve(f).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape')).catch(() => {}); } catch (_) {} }
  showHelp(10); toast(loaded ? 'Bem-vindo de volta!' : 'Saia pela porta e comece a limpar!', 3, 'snow');
});
refreshHUD();
window.__gameStarted = true;
window.__game = { state, player, TOOLS, HEATS, toggleShop, buyZone, toolAction, heatAction, craft, pct, items, VEH, clearAt, meltAt, useVehicle, exitVehicle, DAY, dispZone, zoneSnowFraction };
loop();
</script>
