<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#0b0c13" />
    <meta name="description" content="HOTEL ZERO — aventura narrativa sobrenatural em loop temporal." />
    <title>HOTEL ZERO</title>
  </head>
  <body>
    <div id="game-shell">
      <div id="game"></div>
      <div id="portrait-warning" role="alert">
        <span>↻</span>
        <strong>O hotel exige outra perspectiva.</strong>
        <small>Gire o aparelho para jogar na horizontal.</small>
      </div>
      <div id="touch-controls" aria-label="Controles por toque">
        <div id="joystick" aria-label="Controle de movimento"><div id="stick"></div></div>
        <button id="touch-journal" aria-label="Abrir diário">DIÁRIO</button>
        <button id="touch-interact" aria-label="Interagir">E</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
