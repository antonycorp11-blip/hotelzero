<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neve Zero — Limpe o Vale</title>
<style>
  :root{
    --bg:#16304f; --bg2:#1f416a; --line:rgba(190,225,255,.22);
    --txt:#f2f8ff; --mut:#a6bfd8; --ice:#7fd8ff; --gold:#ffd166; --red:#ff6b6b; --green:#7be495; --ink:#1b2a3c;
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe6fb;color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;
    touch-action:none;-webkit-touch-callout:none;overscroll-behavior:none}
  #game{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
  .ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex-shrink:0}
  button{font:inherit;cursor:pointer;color:var(--txt);border:0;background:none;padding:0}
  .gbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:92px;padding:8px 12px;border-radius:12px;
    font-weight:900;font-size:13px;color:#3b2500;background:linear-gradient(#ffe68a,#ffb627);border-bottom:4px solid #b9770e;
    box-shadow:0 3px 0 rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .gbtn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
  .gbtn.blue{color:#06263a;background:linear-gradient(#bff0ff,#59c3ee);border-bottom-color:#2a7fb0}
  .gbtn.gray,.gbtn:disabled{color:#c9d6e3;background:linear-gradient(#5b6f86,#41546b);border-bottom-color:#2b3a4c;text-shadow:none;cursor:default}
  .gbtn.green{color:#063a14;background:linear-gradient(#b8f5c4,#4fcf6a);border-bottom-color:#258a3c}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #stats{position:absolute;left:calc(8px + var(--safe-l));top:calc(8px + var(--safe-t));display:flex;flex-direction:column;gap:4px;max-width:240px}
  .pill{background:rgba(10,26,46,.6);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:4px 11px;font-size:13px;font-weight:800;
    text-shadow:0 1px 2px #000;align-self:flex-start;display:flex;align-items:center;gap:6px}
  .toprow{display:flex;gap:6px;align-items:center}
  #starsPill{font-size:16px;font-weight:900;color:#ffe27a;text-shadow:0 2px 0 #7a5a00;padding:3px 9px}
  #starsPill .ic{width:18px;height:18px}
  #blizz{position:absolute;left:50%;top:calc(58px + var(--safe-t));transform:translateX(-50%);display:none;padding:4px 14px;border-radius:14px;font-size:13px;font-weight:900;color:#3b2500;background:linear-gradient(#fff3b0,#ffc93d);border:2px solid #7a4a00;box-shadow:0 0 18px rgba(255,201,61,.8);animation:pulse .7s infinite alternate}
  #coinsPill{font-size:19px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 #7a4a00}
  #coinsPill.bump{animation:cbump .35s}
  @keyframes cbump{40%{transform:scale(1.25);filter:brightness(1.35)}}
  .bar{position:relative;width:180px;height:18px;border-radius:12px;background:rgba(10,26,46,.65);border:2px solid rgba(255,255,255,.6);overflow:hidden}
  .bar .fill{position:absolute;inset:0;width:0;background:linear-gradient(#ffffff,#8fdcff 60%,#59b9ea);transition:width .12s}
  .bar .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:900;color:#06263a;text-shadow:0 0 3px rgba(255,255,255,.9)}
  #bagBar.pop{animation:bpop .18s}
  @keyframes bpop{50%{transform:scale(1.06)}}
  #bagBar.full .fill{background:linear-gradient(#ffd0d0,#ff6b6b);animation:pulse .6s infinite alternate}
  #fuelBar{display:none}
  #coldBar{display:none}
  #coldBar .fill{background:linear-gradient(#d8f4ff,#5fb8ff)}
  #frost{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;background:radial-gradient(ellipse at center,rgba(200,235,255,0) 35%,rgba(190,230,255,.85) 100%);box-shadow:inset 0 0 80px rgba(255,255,255,.8)}
  #btnPlace{right:calc(150px + var(--safe-r));bottom:calc(112px + var(--safe-b));width:62px;height:62px;display:none;border-color:#ffd166}
  #placeCnt{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:#ffd166;color:#3b2500;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #7a4a00}
  #fuelBar .fill{background:linear-gradient(#fff2b0,#ffb627)}
  @keyframes pulse{to{filter:brightness(1.35)}}
  #prog{font-size:11px;padding:2px 8px;border:0;background:rgba(10,26,46,.45)}
  #objective{font-size:11px;font-weight:800;color:#e8f6ff;background:rgba(10,26,46,.4);border:0;border-left:3px solid var(--ice);border-radius:6px;padding:2px 7px;line-height:1.3;max-width:230px}
  #objective .ic{width:14px;height:14px;flex-shrink:0}
  #objective:empty{display:none}
  #topRight{position:absolute;right:calc(10px + var(--safe-r));top:calc(10px + var(--safe-t));display:flex;gap:8px;pointer-events:auto}
  .iconbtn{width:44px;height:44px;border-radius:50%;background:rgba(10,26,46,.55);border:2px solid rgba(255,255,255,.35);font-size:22px;display:flex;align-items:center;justify-content:center}
  #cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
  #combo{position:absolute;left:50%;top:calc(50% - 72px);transform:translateX(-50%);font-size:22px;font-weight:900;color:#fff;
    text-shadow:0 0 10px rgba(80,190,255,.95),0 2px 0 #0a3550;opacity:0;transition:opacity .25s;white-space:nowrap}
  #combo.on{opacity:1}
  #combo.lv{animation:lv .3s}
  @keyframes lv{40%{transform:translateX(-50%) scale(1.5)}}
  #section{position:absolute;left:50%;top:calc(50% + 22px);transform:translateX(-50%);display:none;align-items:center;gap:6px;
    padding:3px 10px 3px 6px;border-radius:12px;background:rgba(10,26,46,.6);font-size:12px;font-weight:900;white-space:nowrap}
  #section .ring{width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--ice) var(--p,0%), rgba(255,255,255,.18) 0)}
  #ctx{position:absolute;left:50%;top:calc(50% + 50px);transform:translateX(-50%);padding:5px 12px;border-radius:12px;display:none;
    background:rgba(10,26,46,.7);border:2px solid var(--gold);font-size:13px;font-weight:900;white-space:nowrap;align-items:center;gap:6px}
  #toast{position:absolute;left:50%;top:calc(12px + var(--safe-t));transform:translateX(-50%);padding:8px 16px;border-radius:14px;
    background:rgba(16,40,70,.92);border:2px solid var(--line);font-size:13px;font-weight:700;display:none;text-align:center;max-width:calc(100vw - 360px)}
  #help{position:absolute;left:50%;bottom:calc(10px + var(--safe-b));transform:translateX(-50%);padding:8px 12px;border-radius:12px;
    background:rgba(10,26,46,.55);font-size:12px;line-height:1.6;text-align:center;max-width:min(520px,calc(100vw - 360px));transition:opacity .6s}
  #help.hide{opacity:0}
  #help b{color:var(--ice)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,rgba(255,255,255,0) 40%,rgba(160,225,255,.55) 100%);opacity:0}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .ft{position:absolute;left:0;top:0;white-space:nowrap;font-weight:900;text-shadow:0 0 4px rgba(0,0,0,.7),1px 2px 0 rgba(0,0,0,.6);will-change:transform,opacity;display:flex;align-items:center;gap:4px}

  /* ---------- loja (visual de jogo) ---------- */
  .modalWrap{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(0,10,25,.55);
    padding:calc(8px + var(--safe-t)) calc(8px + var(--safe-r)) calc(8px + var(--safe-b)) calc(8px + var(--safe-l))}
  .modalWrap.open{display:flex}
  .modal{width:100%;max-width:960px;height:100%;max-height:620px;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;
    background:linear-gradient(#1d3d63,#12263f);border:3px solid #6fc6ff;box-shadow:0 0 0 4px var(--ink),0 14px 40px rgba(0,0,0,.6)}
  .modal header{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;background:linear-gradient(#2b5a8e,#1d4370);border-bottom:3px solid var(--ink)}
  .modal header h2{margin:0 6px 0 0;font-size:18px;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 0 var(--ink);white-space:nowrap}
  .tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
  .tab{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;font-weight:900;font-size:13px;color:#cfe6ff;
    background:rgba(0,0,0,.25);border:2px solid transparent;white-space:nowrap}
  .tab.on{background:linear-gradient(#bff0ff,#59c3ee);color:#06263a;border-color:var(--ink)}
  .tab .ic{width:20px;height:20px}
  .coinsTag{display:flex;align-items:center;gap:5px;font-weight:900;font-size:17px;color:var(--gold);text-shadow:0 2px 0 #7a4a00;padding:0 6px;white-space:nowrap}
  .closeBtn{width:40px;height:40px;border-radius:50%;background:linear-gradient(#ff8a8a,#e04848);border:3px solid var(--ink);color:#fff;font-weight:900;font-size:18px;flex-shrink:0}
  .page{flex:1;min-height:0;display:none}
  .page.on{display:flex}
  .slots{flex:1;overflow:auto;padding:10px 12px 14px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
  .secTitle{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#9fd6ff;margin:2px 2px 7px;display:flex;align-items:center;gap:6px}
  .secTitle .ic{width:18px;height:18px}
  .srow{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}
  .slot{position:relative;width:76px;height:86px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;
    background:linear-gradient(#2a5585,#163050);border:3px solid var(--ink);box-shadow:inset 0 0 0 2px var(--rc,#4a6d93),0 4px 0 rgba(0,0,0,.4);color:#fff;font-family:inherit;transition:transform .12s}
  .slot>.ic{width:44px;height:44px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
  .slot i{font-style:normal;font-size:11px;font-weight:900;display:flex;align-items:center;gap:2px;color:var(--gold);text-shadow:0 1px 0 var(--ink)}
  .slot i .ic{width:12px;height:12px}
  .slot.own i{color:#9ff0b0}.slot.no>.ic{opacity:.55}.slot.no i{color:#ff9d9d}.slot.lock>.ic{opacity:.3;filter:grayscale(1)}
  .slot.sel{transform:translateY(-4px) scale(1.04);box-shadow:inset 0 0 0 2px #fff,0 0 0 3px #7fd8ff,0 0 18px #7fd8ff}
  .slot.on::after{content:"";position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;background:#7be495;border:2px solid var(--ink)}
  .slot .cnt{position:absolute;top:3px;left:6px;font-size:13px;font-weight:900;text-shadow:0 1px 0 var(--ink)}
  .slot.can{animation:sglow 1.4s ease-in-out infinite}
  @keyframes sglow{50%{box-shadow:inset 0 0 0 2px var(--rc,#4a6d93),0 0 16px 2px rgba(255,209,102,.85)}}
  .detail{width:250px;flex-shrink:0;border-left:3px solid var(--ink);background:linear-gradient(#1c3a5c,#0f2238);padding:12px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:7px;overflow:auto;text-align:center;touch-action:pan-y}
  .detail .big{width:84px;height:84px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;border:4px solid var(--ink);background:radial-gradient(circle at 35% 30%,#fff,#bfe6ff 60%,#5ea7dc);box-shadow:0 0 0 3px var(--rc,#4a6d93),0 6px 0 rgba(0,0,0,.35)}
  .detail .big .ic{width:56px;height:56px}
  .detail h3{margin:2px 0 0;font-size:17px;font-weight:900;text-shadow:0 2px 0 var(--ink)}
  .detail .rar{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--rc,#9fd6ff)}
  .detail p{margin:0;font-size:12px;color:#bcd6ee;line-height:1.35}
  .detail .gbtn{width:100%;font-size:15px;padding:10px;margin-top:auto}
  .fx{font-size:12px;font-weight:900;color:#9ff0b0;background:rgba(0,0,0,.3);padding:6px 9px;border-radius:10px;width:100%;line-height:1.5}
  .fx em{font-style:normal;color:#ffd166}
  .stats{width:100%;display:flex;flex-direction:column;gap:4px}
  .stat{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:#bcd6ee}
  .stat span{width:48px;text-align:left}
  .stat i{flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;position:relative;border:1px solid var(--ink)}
  .stat i::after{content:"";position:absolute;inset:0;width:var(--v);background:linear-gradient(90deg,#7be495,#7fd8ff)}
  .tag{font-size:10px;font-weight:900;padding:2px 7px;border-radius:8px;background:#ffd166;color:#3b2500;border:2px solid var(--ink)}
  .need{display:flex;flex-direction:column;gap:4px;width:100%}
  .need span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;padding:4px 8px;border-radius:10px;background:rgba(0,0,0,.3)}
  .need span .ic{width:22px;height:22px}.need span b{margin-left:auto}
  .need span.ok{color:#9ff0b0}.need span.no{color:#ff9d9d}
  .quest{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:7px;border-radius:12px;background:linear-gradient(#2a5585,#1b3b60);border:3px solid var(--ink)}
  .quest>.ic{width:34px;height:34px;flex-shrink:0}.quest .qb{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
  .quest .qr{display:flex;align-items:center;gap:3px;font-weight:900;color:#ffe27a;font-size:15px}.quest .qr .ic{width:18px;height:18px}
  .diary{width:100%;text-align:left;background:#f3e6c4;color:#3b2a14;border-radius:6px;padding:6px 9px}.diary b{font:italic 900 12px Georgia,serif}.diary p{margin:3px 0 0;color:#4a3618;font:italic 12px/1.4 Georgia,serif}
  .mis{display:flex;align-items:center;gap:6px;width:100%;font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:9px;background:rgba(0,0,0,.28);color:#bcd6ee}
  .mis .ic{width:18px;height:18px}.mis.done{color:#9ff0b0}.mis.cur{color:#fff;box-shadow:inset 0 0 0 2px #7fd8ff}.mis b{margin-left:auto;color:#ffd166}
  /* árvore de habilidades: mapa arrastável */
  .tmap{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 50%,#1f4170 0%,#0b1729 80%)}
  .tmap::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(160,210,255,.16) 1px,transparent 1.6px);background-size:24px 24px;pointer-events:none}
  .tworld{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0}
  .tlinks{position:absolute;left:-1000px;top:-1000px;width:2000px;height:2000px;overflow:visible;pointer-events:none}
  .tn{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;padding:5px;background:conic-gradient(#7be495 calc(var(--p)*1%),#0b1b2e 0);box-shadow:0 0 0 3px var(--ink),0 5px 0 rgba(0,0,0,.45)}
  .tn .in{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff,#a9dcff 60%,#4a97cf);border:2px solid var(--ink)}
  .tn .in .ic{width:32px;height:32px}
  .tn .lv{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);font-size:10px;font-weight:900;padding:1px 7px;border-radius:8px;background:#0f2238;border:2px solid var(--ink);white-space:nowrap}
  .tn .nm{position:absolute;left:50%;top:-19px;transform:translateX(-50%);font-size:10.5px;font-weight:900;white-space:nowrap;text-shadow:0 1px 0 #000,0 0 5px #000}
  .tn.core{width:84px;height:84px;margin:-42px 0 0 -42px}.tn.core .in .ic{width:44px;height:44px}
  .tn.lock .in{filter:grayscale(1) brightness(.55)}
  .tn.myst{background:#0b1b2e}.tn.myst .in{background:#162740}.tn.myst .in .ic{opacity:.45}
  .tn.max{background:#ffd34d;box-shadow:0 0 0 3px var(--ink),0 0 18px rgba(255,211,77,.85)}
  .tn.max .in{background:radial-gradient(circle at 35% 30%,#fff7c8,#ffd34d 60%,#d9930f)}
  .tn.can{animation:tglow 1.3s ease-in-out infinite}
  @keyframes tglow{50%{box-shadow:0 0 0 3px var(--ink),0 0 22px 5px rgba(127,216,255,.95)}}
  .tn.sel::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px dashed #fff;animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .thint{position:absolute;left:10px;bottom:8px;font-size:11px;font-weight:800;color:#8fb3d6;pointer-events:none}
  .zoomBtns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
  .zoomBtns button{width:36px;height:36px;border-radius:10px;font-size:20px;font-weight:900;color:#fff;background:#24476f;border:3px solid var(--ink)}
  .settings{margin-top:10px}
  .paper{position:relative;max-width:420px;width:100%;padding:24px 26px 18px;background:linear-gradient(#fbf3dc,#efe0b8);color:#3b2a14;border-radius:6px;transform:rotate(-1.2deg);box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(150,110,50,.25);text-align:center}
  .paper h3{margin:0 0 10px;font:italic 900 17px Georgia,serif;color:#5a3a12}
  .paper p{margin:0 0 16px;font:italic 15px/1.55 Georgia,serif}
  .paper .pin{position:absolute;top:-8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9a8a,#c0302a);box-shadow:0 2px 3px rgba(0,0,0,.5)}
  #win .modal{max-width:440px;height:auto;text-align:center}
  #win .body{padding:18px 20px;line-height:1.55;font-size:14px;color:#cfe3f7}
  #win .body b{color:#fff}
  #win .actions{display:flex;gap:10px;justify-content:center;padding:0 20px 18px;flex-wrap:wrap}

  /* ---------- toque ---------- */
  #touchUI{position:fixed;inset:0;pointer-events:none;z-index:6;display:none}
  body.touch #touchUI{display:block}
  body.touch .tbtn, body.touch #topRight{pointer-events:none}
  #joyBase{position:absolute;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(10,26,46,.18);display:none}
  #joyBase.idle{display:block;opacity:.45;left:calc(98px + var(--safe-l));top:calc(100% - 98px - var(--safe-b))}
  #joyKnob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.8)}
  .tbtn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
    touch-action:none;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(10,26,46,.55));border:4px solid rgba(255,255,255,.7);transition:transform .08s}
  .tbtn .ic{width:60%;height:60%;vertical-align:0}
  #btnAct{right:calc(28px + var(--safe-r));bottom:calc(26px + var(--safe-b));width:100px;height:100px}
  #btnHeat{right:calc(140px + var(--safe-r));bottom:calc(30px + var(--safe-b));width:70px;height:70px;display:none;border-color:#ffb36b}
  .tbtn.pressed, .iconbtn.pressed{transform:scale(.88);background:rgba(127,216,255,.55)}
  #rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:#0c1a2c;color:var(--txt);font-size:17px;text-align:center;padding:24px}
  #rotate .ph{font-size:56px;animation:rot 1.6s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){ body.touch #rotate{display:flex} }
  #start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,30,60,.25)}
  #start .box{background:linear-gradient(#1d3d63,#12263f);border:3px solid #6fc6ff;box-shadow:0 0 0 4px var(--ink);border-radius:20px;padding:22px 28px;text-align:center;max-width:min(440px,calc(100vw - 32px))}
  #start h1{margin:0 0 4px;font-size:34px;letter-spacing:3px;text-shadow:0 0 18px rgba(127,216,255,.7),0 3px 0 #0a3550}
  #start p{margin:6px 0 16px;font-size:14px;color:#bcd6ee;line-height:1.5}
  #start .gbtn{font-size:18px;padding:11px 36px}
